name: Publish VibeFishin v2.0.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'publish-v2-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate Lua and addon structure
        run: |
          lua5.1 scripts/check_syntax.lua Core/VibeFishin.lua
          python3 scripts/package_release.py --check
      - name: Package installable addon
        run: python3 scripts/package_release.py
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2.0.0" "VibeFishin-v2.0.0-forever.zip" --target "$GITHUB_SHA" --title "Vibe - Fishing Aquarium v2.0.0" --notes "First public GitHub release of Vibe - Fishing Aquarium by Pepkilz. WoW Forever interface 16001. Download the attached VibeFishin-v2.0.0-forever.zip for WowUp or manual installation. This version includes aquarium fish care, hunger, temperature simulation, customizable visuals, the fish roster, and performance settings. WoW Forever live-client behavior remains subject to user testing."
