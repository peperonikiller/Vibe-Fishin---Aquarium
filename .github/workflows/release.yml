name: Validate and package addon
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Lua syntax check
        run: lua5.1 scripts/check_syntax.lua Core/VibeFishin.lua
      - name: Validate source and media
        run: python3 scripts/package_release.py --check
      - name: Build installable ZIP
        run: python3 scripts/package_release.py
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeFishin-release
          path: VibeFishin-v*.zip
          if-no-files-found: error
      # Publishing a version on main automatically makes a matching release.
      # This also supports repository updates without a manually pushed Git tag.
      - name: Publish new version from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^## Version: //p' VibeFishin.toc | head -n 1 | tr -d '\r')
          test -n "$VERSION"
          TAG="v${VERSION}"
          PACKAGE="VibeFishin-${TAG}-forever.zip"
          test -f "$PACKAGE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not replacing its assets."
          else
            gh release create "$TAG" "$PACKAGE" --target "$GITHUB_SHA" --title "Vibe - Fishing Aquarium $TAG" --generate-notes
          fi
      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" "VibeFishin-${GITHUB_REF_NAME}-forever.zip" --title "Vibe - Fishing Aquarium ${GITHUB_REF_NAME}" --generate-notes
